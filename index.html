<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fortify Health Premix Batch Scanner: scan, verify and record batch-wise premix transactions.">
<meta name="theme-color" content="#dc6059">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Premix Scanner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Premix Batch Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Layout: one narrow app column (phone first). Scanner card dominates home; focused flows hide the tab bar and pin their action to the bottom. */
:root{
  --coral:#dc6059; --coral-strong:#c2544e; --coral-soft:rgba(220,96,89,.10); --coral-border:rgba(220,96,89,.28);
  --slate:#474f54; --mint:#bfe0d3; --mint-deep:#47816b;
  --bg:#f6f5f3; --card:#ffffff; --fg:#1c1917; --fg-2:#44403c; --muted:#f1efed; --muted-fg:#6f6862;
  --border:#e7e5e4; --border-strong:#d6d3d1; --field-locked:#f7f6f4;
  --ok:#16a34a; --ok-bg:#dcfce7; --ok-fg:#166534; --ok-bd:#bbf7d0;
  --warn:#f59e0b; --warn-bg:#fef3c7; --warn-fg:#92400e; --warn-bd:#fde68a;
  --err:#dc2626; --err-bg:#fee2e2; --err-fg:#991b1b; --err-bd:#fecaca;
  --pend-bg:#f1efed; --pend-fg:#6f6862;
  --on-coral:#ffffff; --shadow:0 1px 2px rgba(28,25,23,.05); --sheet-shadow:0 -10px 30px -5px rgba(0,0,0,.18);
  --scrim:rgba(28,25,23,.45);
  --scan-bg:#0f0e0d; --scan-fg:#fafaf9; --scan-dim:rgba(255,255,255,.66);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:8px; --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --coral:#e3706a; --coral-strong:#dc6059; --coral-soft:rgba(227,112,106,.15); --coral-border:rgba(227,112,106,.35);
  --bg:#141211; --card:#1e1b19; --fg:#f5f4f3; --fg-2:#d6d3d1; --muted:#2a2623; --muted-fg:#a8a29e;
  --border:#34302c; --border-strong:#48423d; --field-locked:#24211e;
  --ok-bg:rgba(22,163,74,.18); --ok-fg:#86efac; --ok-bd:rgba(22,163,74,.4);
  --warn-bg:rgba(245,158,11,.16); --warn-fg:#fcd34d; --warn-bd:rgba(245,158,11,.4);
  --err-bg:rgba(220,38,38,.18); --err-fg:#fca5a5; --err-bd:rgba(220,38,38,.45);
  --pend-bg:#2a2623; --pend-fg:#a8a29e; --on-coral:#1a0c0b; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --coral:#e3706a; --coral-strong:#dc6059; --coral-soft:rgba(227,112,106,.15); --coral-border:rgba(227,112,106,.35);
  --bg:#141211; --card:#1e1b19; --fg:#f5f4f3; --fg-2:#d6d3d1; --muted:#2a2623; --muted-fg:#a8a29e;
  --border:#34302c; --border-strong:#48423d; --field-locked:#24211e;
  --ok-bg:rgba(22,163,74,.18); --ok-fg:#86efac; --ok-bd:rgba(22,163,74,.4);
  --warn-bg:rgba(245,158,11,.16); --warn-fg:#fcd34d; --warn-bd:rgba(245,158,11,.4);
  --err-bg:rgba(220,38,38,.18); --err-fg:#fca5a5; --err-bd:rgba(220,38,38,.45);
  --pend-bg:#2a2623; --pend-fg:#a8a29e; --on-coral:#1a0c0b; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral-border);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hdr .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:34px;height:34px}
.brand{flex:1;min-width:0;line-height:1.2}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:14px;color:var(--muted-fg)}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.net .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.net.off{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;flex:none;position:relative}
.iconbtn .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--on-coral);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.offbar{background:var(--warn-bg);color:var(--warn-fg);border-bottom:1px solid var(--warn-bd);font-size:15px}
.offbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.offbar b{font-weight:700}

main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
main.focus{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.page{display:flex;flex-direction:column;gap:20px;padding-block:20px}
.intro h1{font-size:26px;font-weight:700;line-height:1.2}
.intro p{color:var(--muted-fg);margin-top:6px;max-width:40ch}
.mill-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-2);margin-top:10px}
.mill-line b{font-weight:600}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h a,.link{color:var(--coral-strong);font-weight:600;font-size:15px;background:none;border:0;padding:6px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec-h a,:root:not([data-theme="light"]) .link{color:var(--coral)}}
:root[data-theme="dark"] .link{color:var(--coral)}

/* Scanner hero */
.scan-hero{padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;border-color:var(--coral-border)}
.finder{width:min(62vw,220px);aspect-ratio:1;max-width:100%;position:relative;display:grid;place-items:center;border-radius:14px;background:var(--coral-soft);margin-bottom:6px}
.finder .c{position:absolute;width:34px;height:34px;border:4px solid var(--coral);}
.finder .tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.finder .tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.finder .bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.finder .br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.finder svg.i{width:84px;height:84px;color:var(--coral);stroke-width:1.5}
.finder .line{position:absolute;left:14%;right:14%;height:3px;border-radius:2px;background:var(--coral);opacity:.75;top:20%;animation:sweep 2.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:78%}}
.scan-hero h2{font-size:23px;font-weight:700;line-height:1.25}
.scan-hero p{color:var(--muted-fg);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:17px;transition:background .15s,opacity .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--coral);color:var(--on-coral)}
.btn-primary:hover:not([disabled]){background:var(--coral-strong)}
.btn-xl{min-height:60px;font-size:18px;font-weight:700;width:100%;border-radius:14px}
.btn-xl svg.i{width:24px;height:24px}
.btn-outline{background:var(--card);border-color:var(--border-strong);color:var(--fg)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{background:transparent;color:var(--fg-2);border-color:var(--border)}
.btn-block{width:100%}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:4px;padding-top:16px;border-top:1px solid var(--border)}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg)}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--fg-2);font-size:13px;letter-spacing:0}
.step.on i{background:var(--coral);color:var(--on-coral)}
.step.done i{background:var(--ok-bg);color:var(--ok-fg)}
.step.on{color:var(--fg)}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border)}
.qa button:hover{border-color:var(--border-strong)}
.qa .ic{width:40px;height:40px;border-radius:10px;background:var(--muted);display:grid;place-items:center;color:var(--fg-2)}
.qa b{font-size:17px}
.qa span{font-size:14px;color:var(--muted-fg);line-height:1.35}

/* Alerts */
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid;align-items:flex-start}
.alert svg.i{margin-top:2px}
.alert b{display:block;font-weight:700}
.alert .sub{font-size:15px}
.a-ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.a-warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
.a-err{background:var(--err-bg);color:var(--err-fg);border-color:var(--err-bd)}
.a-pend{background:var(--pend-bg);color:var(--fg-2);border-color:var(--border)}
.alert .grow{flex:1;min-width:0}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)}
.p-err{background:var(--err-bg);color:var(--err-fg)}
.p-pend{background:var(--pend-bg);color:var(--pend-fg)}
.p-coral{background:var(--coral-soft);color:var(--coral-strong)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
.tag svg.i{width:14px;height:14px}

/* Activity list */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--border);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--muted);color:var(--fg-2);flex:none}
.row .main{flex:1;min-width:0}
.row .t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .t1 .mono{font-weight:600;font-size:16px}
.row .t2{font-size:15px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t3{font-size:13px;color:var(--muted-fg)}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted-fg);min-height:52px;justify-content:center;border-radius:12px;position:relative}
.nav button.on{color:var(--fg)}
.nav button.on::after{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:2px;background:var(--coral)}
.nav button.scan{background:var(--coral);color:var(--on-coral)}
.nav button.scan::after{display:none}
.nav .cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#1c1917;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* Focused flow top bar */
.topbar{display:flex;align-items:center;gap:10px;padding-top:14px}
.topbar h1{font-size:20px;font-weight:700;flex:1}
.mini-steps{display:flex;gap:4px}
.mini-steps span{width:22px;height:5px;border-radius:3px;background:var(--border-strong)}
.mini-steps span.done{background:var(--ok)}
.mini-steps span.on{background:var(--coral)}

/* Batch details */
.bd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.bd-head h2{font-size:18px;font-weight:700}
.bd-batch{padding:16px 20px 4px}
.bd-batch .lbl{font-size:14px;color:var(--muted-fg)}
.bd-batch .val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border);margin-top:12px}
.kv>div{background:var(--field-locked);padding:12px 20px;min-width:0}
.kv>div.full{grid-column:1/-1}
.kv .k{font-size:14px;color:var(--muted-fg);display:flex;gap:6px;align-items:center}
.kv .v{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.kv input,.kv select{width:100%;margin-top:4px;min-height:44px;border:1px solid var(--coral-border);border-radius:var(--r-sm);padding:0 10px;background:var(--card);font-size:16px}
.edited{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn-fg);background:var(--warn-bg);padding:1px 6px;border-radius:4px}
.bd-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;flex-wrap:wrap;border-top:1px solid var(--border)}
.bd-foot small{font-size:14px;color:var(--muted-fg)}
.btn-sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:10px}

/* User entry */
.entry{border-color:var(--coral-border)}
.entry .hd{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.field{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.field+.field{border-top:1px solid var(--border)}
.field>label,.field .flabel{font-size:17px;font-weight:700}
.qty{display:flex;gap:10px}
.qty input{flex:1;min-width:0;height:64px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:30px;font-weight:700;padding:0 16px;font-variant-numeric:tabular-nums}
.qty input:focus{border-color:var(--coral);outline:none;box-shadow:0 0 0 4px var(--coral-soft)}
.qty select{width:112px;height:64px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:18px;font-weight:600;padding:0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--border-strong);background:var(--card);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-strong)}
.hint{font-size:15px;color:var(--muted-fg)}
.hint b{color:var(--fg);font-weight:600}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{text-align:left;padding:14px;border-radius:var(--r);border:2px solid var(--border);background:var(--card);display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.type .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--muted);color:var(--fg-2)}
.type b{font-size:16px}
.type span{font-size:13px;color:var(--muted-fg);line-height:1.3}
.type.on{border-color:var(--coral);background:var(--coral-soft)}
.type.on .ic{background:var(--coral);color:var(--on-coral)}
.type .tick{position:absolute;top:12px;right:12px;color:var(--coral);display:none}
.type.on .tick{display:block}
.sel{width:100%;min-height:56px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:17px;font-weight:600;padding:0 14px}
.sel:focus{border-color:var(--coral);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--muted);border-radius:var(--r);padding:4px;gap:4px}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted-fg)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--coral);margin-top:1px;flex:none}

/* Validation */
.val-list{display:flex;flex-direction:column;gap:2px;padding:6px 8px 10px}
.vi{display:flex;gap:10px;padding:8px 12px;font-size:15px;align-items:flex-start;border-radius:8px}
.vi svg.i{margin-top:1px}
.vi.ok svg{color:var(--ok)} .vi.warn svg{color:var(--warn)} .vi.error{color:var(--err-fg);background:var(--err-bg)} .vi.error svg{color:var(--err)} .vi.pending{color:var(--muted-fg)}
.vi.warn{color:var(--fg)}
.val-head{padding:14px 16px;margin:10px 10px 4px}

/* Sticky action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:6px}
.actionbar .why{font-size:14px;color:var(--muted-fg);text-align:center}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);max-height:88vh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 14px}
.sheet h2{font-size:21px;font-weight:700}
.sheet .sub{color:var(--muted-fg);margin-top:4px}
.sum{margin:16px 0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.sum>div{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;border-top:1px solid var(--border);font-size:16px}
.sum>div:first-child{border-top:0}
.sum dt,.sum .k{color:var(--muted-fg)}
.sum .v{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.sheet-actions{display:flex;flex-direction:column;gap:10px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:84vh}}

/* Success */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 8px 8px}
.big-check{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:8px;animation:pop .45s cubic-bezier(.16,1,.3,1)}
.big-check.off{background:var(--warn-bg);color:var(--warn)}
.big-check svg.i{width:52px;height:52px;stroke-width:2.5}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.success h1{font-size:26px;font-weight:700}
.success .b{font-family:var(--mono);font-size:22px;font-weight:600}
.success .q{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.success .q small{font-size:22px;font-weight:600;color:var(--muted-fg)}
.txid{margin-top:14px;padding:14px 18px;border-radius:var(--r);border:1px dashed var(--border-strong);background:var(--field-locked);width:100%}
.txid .k{font-size:14px;color:var(--muted-fg)}
.txid .v{font-family:var(--mono);font-size:22px;font-weight:600}

/* Inventory */
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--card)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;min-height:48px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.filters .chip{flex:none;display:inline-flex;align-items:center;gap:6px}
.filters .chip small{font-size:13px;color:var(--muted-fg)}
.inv{display:grid;gap:12px}
.ic-card{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.ic-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ic-top .mono{font-size:19px;font-weight:600}
.ic-top .mill{font-size:15px;color:var(--fg-2)}
.ic-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-top:1px solid var(--border);padding-top:12px}
.ic-mid .qtyv{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ic-mid .qtyv small{font-size:16px;color:var(--muted-fg);font-weight:600}
.ic-mid .exp{text-align:right;font-size:14px;color:var(--muted-fg)}
.ic-mid .exp b{display:block;font-size:16px;color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate);border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border)}
.stats>div{background:var(--card);padding:14px}
.stats .k{font-size:13px;color:var(--muted-fg);line-height:1.3}
.stats .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.stats .v small{font-size:14px;color:var(--muted-fg);font-weight:600}
.empty{padding:32px 20px;text-align:center;color:var(--muted-fg)}

/* Scanner overlay */
.scanner{position:fixed;inset:0;z-index:60;background:var(--scan-bg);color:var(--scan-fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.sc-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:var(--scan-fg);display:grid;place-items:center}
.sc-btn.on{background:#fde68a;color:#1c1917}
.sc-title{font-weight:600;font-size:17px}
.sc-view{position:relative;z-index:1;flex:1;display:grid;place-items:center;min-height:0}
.sc-frame{width:min(72vw,300px);aspect-ratio:1;max-width:100%;position:relative;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.sc-frame .c{position:absolute;width:44px;height:44px;border:5px solid #fff}
.sc-frame .tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:18px}
.sc-frame .tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:18px}
.sc-frame .bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:18px}
.sc-frame .br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:18px}
.sc-frame .line{position:absolute;left:8%;right:8%;height:3px;border-radius:2px;background:var(--coral);box-shadow:0 0 12px var(--coral);top:12%;animation:sweep2 2s ease-in-out infinite alternate}
@keyframes sweep2{to{top:86%}}
.sc-frame.found .c{border-color:#4ade80}
.sc-frame.found .line{display:none}
.sc-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:15px;color:var(--scan-dim)}
.sc-msg svg.i{width:40px;height:40px;margin:0 auto 8px;display:block;opacity:.7}
.sc-ok{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.sc-ok>div{background:rgba(22,101,52,.92);color:#fff;border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:18px;animation:pop .35s cubic-bezier(.16,1,.3,1)}
.sc-ok svg.i{width:48px;height:48px;stroke-width:2.5}
.sc-bottom{position:relative;z-index:2;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0))}
.sc-bottom .inst{text-align:center;font-size:17px;font-weight:600}
.sc-bottom .note{text-align:center;font-size:14px;color:var(--scan-dim)}
.sc-bottom .btn-outline{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.sc-samples{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sc-samples button{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:600}
.sc-samples button span{font-family:var(--mono)}
.sc-samples .lab{align-self:center;font-size:13px;color:var(--scan-dim);flex:none;padding-right:2px}
.sc-err{background:rgba(220,38,38,.9);color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px);box-shadow:var(--sheet-shadow);animation:up .2s ease-out}
.toast.ok svg{color:#4ade80}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.switch b{display:block}
.switch small{color:var(--muted-fg);font-size:14px}
.tog{width:52px;height:32px;border-radius:16px;background:var(--border-strong);border:0;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--coral)}
.tog.on::after{left:23px}
.prof{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--coral-soft);color:var(--coral-strong);display:grid;place-items:center;font-weight:700;font-size:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:900px){
  .wrap{max-width:1040px}
  .home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
  .home-grid>div{display:flex;flex-direction:column;gap:20px}
  .verify-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:start}
  .verify-grid>div{display:flex;flex-direction:column;gap:20px}
  .inv{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .actionbar .wrap{max-width:560px;margin-left:auto;margin-right:max(16px,calc((100vw - 1040px)/2 + 16px))}
  .nav .wrap{max-width:560px}
}
@media (max-width:899px){.home-grid,.home-grid>div,.verify-grid,.verify-grid>div{display:flex;flex-direction:column;gap:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Helpers ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) };
const fmtD = s => { if(!s) return '—'; const d=pd(s); return `${String(d.getDate()).padStart(2,'0')}-${MON[d.getMonth()]}-${d.getFullYear()}` };
const fmtTs = t => { const d=new Date(t); const hh=d.getHours(), mm=String(d.getMinutes()).padStart(2,'0'); return `${String(d.getDate()).padStart(2,'0')}-${MON[d.getMonth()]}-${d.getFullYear()}, ${((hh+11)%12)+1}:${mm} ${hh<12?'am':'pm'}` };
const ago = t => { const m=Math.round((Date.now()-t)/60000); if(m<1) return 'Just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' h ago'; const d=Math.round(h/24); return d===1?'Yesterday':d+' days ago' };
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d };
const daysLeft = exp => Math.round((pd(exp)-today0())/864e5);
const expState = exp => { const n=daysLeft(exp); return n<0?'expired':(n<=NEAR_DAYS?'near':'valid') };
const kg = n => (Math.round(n*1000)/1000).toLocaleString('en-IN',{maximumFractionDigits:3});
const mill = id => MILLS.find(m=>m.id===id) || {id, name:id, short:id};
const online = () => navigator.onLine && !D.simOffline;
const pending = () => D.txns.filter(t=>t.sync==='pending');
const stockOf = (b,m) => (D.stock.find(r=>r.b===b && r.m===m)||{q:0}).q;
function addStock(b,m,q){ let r=D.stock.find(r=>r.b===b&&r.m===m); if(!r){ r={b,m,q:0}; D.stock.push(r) } r.q=Math.max(0,Math.round((r.q+q)*1000)/1000) }

function statusPill(exp, q){
 const st = expState(exp);
 if(st==='expired') return `<span class="pill p-err">${I('err')}Expired</span>`;
 if(st==='near') return `<span class="pill p-warn">${I('warn')}Near Expiry</span>`;
 if(q!=null && q<LOW_KG) return `<span class="pill p-warn">Low Stock</span>`;
 return `<span class="pill p-ok">${I('okc')}Valid</span>`;
}
const svgSmall = s => s.replace(/class="i /g,'style="width:14px;height:14px" class="i ');

/* ---------- Toast ---------- */
let toastT;
function toast(msg, ok){ clearTimeout(toastT); let el=document.querySelector('.toast'); if(el) el.remove();
 el=document.createElement('div'); el.className='toast'+(ok?' ok':''); el.setAttribute('role','status'); el.innerHTML=(ok?I('okc'):'')+esc(msg); document.body.appendChild(el);
 toastT=setTimeout(()=>el.remove(),2800) }

function txDesc(t){

/* ---------- Inventory ---------- */
function invRows(){
 let rows = D.stock.filter(r=>r.q>0 && (S.invScope==='all' || r.m===D.mill));
 const q = S.invQ.trim().toLowerCase();
 if(q) rows = rows.filter(r=>r.b.toLowerCase().includes(q) || mill(r.m).name.toLowerCase().includes(q));
 return rows;
}
function catOf(r){ const b=BATCHES[r.b]; const st=b?expState(b.exp):'valid'; return st }
function vInventory(){
 const base = invRows();
 const f = {all:base, valid:base.filter(r=>catOf(r)==='valid'), near:base.filter(r=>catOf(r)==='near'), expired:base.filter(r=>catOf(r)==='expired'), low:base.filter(r=>r.q<LOW_KG)};
 const rows = f[S.invFilter].slice().sort((a,b)=>(BATCHES[a.b]?.exp||'').localeCompare(BATCHES[b.b]?.exp||''));
 const total = base.reduce((s,r)=>s+r.q,0);
 const chip=(k,l)=>`<button class="chip ${S.invFilter===k?'on':''}" data-a="invf" data-f="${k}">${l}<small>${f[k].length}</small></button>`;
 return `<div class="page">
  <div class="intro"><h1>Batch-wise Inventory</h1><p>${S.invScope==='mill'?`Premix stock at ${esc(mill(D.mill).name)}.`:'Premix stock across all mills.'} Sorted by expiry, earliest first.</p></div>
  <div class="seg" role="group" aria-label="Scope"><button class="${S.invScope==='mill'?'on':''}" data-a="scope" data-s="mill">This Mill</button><button class="${S.invScope==='all'?'on':''}" data-a="scope" data-s="all">All Mills</button></div>
  <div class="stats"><div><div class="k">Available</div><div class="v">${kg(total)} <small>kg</small></div></div><div><div class="k">Batches</div><div class="v">${new Set(base.map(r=>r.b)).size}</div></div><div><div class="k">Need Attention</div><div class="v" style="color:${f.near.length+f.expired.length?'var(--warn-fg)':'inherit'}">${f.near.length+f.expired.length}</div></div></div>
  <label class="search">${I('search')}<span class="sr">Search</span><input id="invq" type="search" placeholder="Search by batch or mill" value="${esc(S.invQ)}" autocomplete="off"></label>
  <div class="filters" role="group" aria-label="Filter">${chip('all','All')}${chip('valid','Valid')}${chip('near','Near Expiry')}${chip('expired','Expired')}${chip('low','Low Stock')}</div>
  <div class="inv" id="invlist">${rows.length?rows.map(invCard).join(''):`<div class="card empty">No batches match this filter.</div>`}</div>
 </div>`;
}
function invCard(r){
 const b = BATCHES[r.b]; const n = daysLeft(b.exp); const st=expState(b.exp);
 const pct = Math.min(100, r.q / b.initial * 100);
 return `<button class="card ic-card" data-a="startbatch" data-b="${r.b}" data-m="${r.m}" aria-label="Record transaction for ${r.b}">
  <div class="ic-top"><div><div class="mono">${r.b}</div><div class="mill">${esc(mill(r.m).short)} · ${esc(b.vendor)}</div></div>${statusPill(b.exp, r.q)}</div>
  <div class="ic-mid"><div class="qtyv">${kg(r.q)} <small>kg</small><div class="hint" style="margin-top:6px">${Math.floor(r.q/b.pack)} packs of ${b.pack} kg${r.q<LOW_KG&&st==='valid'?'':''}</div></div>
   <div class="exp">Expiry<b>${fmtD(b.exp)}</b><span style="color:${st==='expired'?'var(--err-fg)':st==='near'?'var(--warn-fg)':'inherit'};font-weight:${st==='valid'?400:600}">${n<0?`Expired ${-n} days ago`:`${n} days remaining`}</span></div></div>
  <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
 </button>`;
}

  <div class="seg" role="group"><button class="${S.txFilter==='all'?'on':''}" data-a="txf" data-f="all">All (${D.txns.length})</button><button class="${S.txFilter==='pending'?'on':''}" data-a="txf" data-f="pending">Waiting to Sync (${n})</button></div>

 </div>`;

/* ---------- Draft / Verify ---------- */
function newDraft(batch, source, payload){
 const m = BATCHES[batch];
 const f = m ? {vendor:m.vendor, product:m.product, mfg:m.mfg, exp:m.exp, pack:m.pack} :
   {vendor:payload.vendor||'', product:payload.product||'', mfg:payload.mfg||'', exp:payload.exp||'', pack:Number(payload.pack)||25};
 return {batch, source, scannedAt:Date.now(), registered:!!m, f, orig:{...f}, editing:false,
   qty:'', unit:'kg', type:null, dest:'', adjDir:'decrease', adjReason:'', override:false, approver:'', ovrReason:'', dupAck:false};
}
function qtyKg(d){ const v = parseFloat(String(d.qty).replace(',','.')); if(!isFinite(v)) return NaN; return d.unit==='packs' ? v*(d.f.pack||25) : v }
function edits(d){ return Object.keys(d.f).filter(k=>String(d.f[k])!==String(d.orig[k])) }

function validate(d){
 const out=[]; const add=(state,text)=>out.push({state,text});
 const avail = stockOf(d.batch, D.mill); const mName = mill(D.mill).short;
 add('ok', d.source==='manual'?'Batch selected from Batch Master':'Batch number read from label');
 if(!d.registered) add('error', `Batch ${d.batch} is not registered in the Batch Master`);
 else add('ok','Registered in Batch Master');
 if(d.f.exp){
  const n = daysLeft(d.f.exp);
  if(n<0){ if(d.override && d.approver && d.ovrReason) add('warn',`Expired batch · override approved by ${d.approver}`); else add('error','This batch has expired. Authorised override required.') }
  else if(n<=NEAR_DAYS) add('warn',`Near expiry: ${n} days remaining. Use this batch first.`);
  else add('ok',`Within shelf life: ${n} days remaining`);
 } else add('error','Expiry date missing');
 const q = qtyKg(d);
 const decreasing = d.type==='consume' || d.type==='relocate' || (d.type==='adjust' && d.adjDir==='decrease');
 if(d.qty==='' ) add('pending','Enter a quantity');
 else if(!isFinite(q) || q<=0) add('error','Enter a quantity greater than 0');
 else if(!/^\d+([.,]\d{1,3})?$/.test(String(d.qty).trim())) add('error','Use up to 3 decimal places');
 else if(q>5000) add('error','Quantity looks too large. Check the value and unit.');
 else if(decreasing && q>avail) add('error',`Quantity exceeds available stock (${kg(avail)} kg at ${mName})`);
 else { add('ok',`Quantity valid: ${kg(q)} kg`); if(d.type==='receive' && d.f.pack && Math.abs(q/d.f.pack - Math.round(q/d.f.pack))>1e-9) add('warn',`${kg(q)} kg is not a whole number of ${d.f.pack} kg packs`) }
 if(!d.type) add('pending','Select a transaction type');
 if(d.type==='relocate'){ if(!d.dest) add('pending','Select a destination mill'); else if(d.dest===D.mill) add('error','Destination must be a different mill'); else add('ok',`Destination: ${mill(d.dest).name}`) }
 if(d.type==='adjust' && !d.adjReason) add('pending','Select a reason for the adjustment');
 const e = edits(d); if(e.length) add('warn',`Batch details edited (${e.length}) · will be flagged for review`);
 let dup=null;
 if(d.type && isFinite(q)) dup = D.txns.find(t=>t.batch===d.batch && t.type===d.type && Math.abs(t.qty-q)<1e-9 && t.mill===D.mill && (t.dest||'')===(d.type==='relocate'?d.dest:(d.type==='receive'?D.mill:'')) && Date.now()-t.ts<15*60e3);
 if(dup) add(d.dupAck?'warn':'error',`Possible duplicate of ${dup.id} submitted ${ago(dup.ts).toLowerCase()}`);
 const errs=out.filter(o=>o.state==='error').length, pend=out.filter(o=>o.state==='pending').length, warns=out.filter(o=>o.state==='warn').length;
 return {items:out, errs, pend, warns, dup, ok:!errs&&!pend};
}

  }

 };

 return `<div class="page">

   :`<div class="alert a-err">${I('err')}<div class="grow"><b>Batch not registered</b><div class="sub">${esc(d.batch)} is not in the Batch Master. Check the label, or ask your Quality Manager to register this batch.</div></div></div>`}
  <div class="verify-grid"><div>
   <section class="card" aria-labelledby="bdH">
    <div class="bd-head"><h2 id="bdH">Batch Details</h2><span class="tag">${I('lock')}${d.source==='manual'?'From Batch Master':'Scanned · System-generated'}</span></div>

    <div class="kv">

     ${kvv('mfg','Manufacturing Date',fmtD(b.mfg),'date')}
     ${kvv('exp','Expiry Date',expTxt+(st?` ${svgSmall(statusPill(b.exp))}`:''),'date')}

     <div><div class="k">Available at ${esc(mill(D.mill).short)}</div><div class="v num">${kg(avail)} kg</div></div>
    </div>
    <div class="bd-foot"><small>${d.editing?'Edited fields are flagged for review.':'Locked to prevent entry errors.'}</small>
     <button class="btn btn-ghost btn-sm" data-a="edit">${I(d.editing?'check':'pencil')}${d.editing?'Done Editing':'Edit Batch Details'}</button></div>
   </section>
   ${expAlert}
  </div><div>
   <section class="card entry" aria-labelledby="enH">
    <div class="hd"><h2 id="enH" style="font-size:18px;font-weight:700">Your Entry</h2><span class="tag" style="color:var(--coral-strong)">${I('pencil')}Entered by you</span></div>
    <div class="field">

    </div>
    ${d.type==='relocate'?`<div class="field"><label for="dest">Destination Mill</label>

   </section>

 </div>`;

function qtyHint(d){
 const q = qtyKg(d); const pk = d.f.pack||25;
 if(!isFinite(q)||q<=0) return `Kilograms by default. Pack size is <b>${pk} kg</b>.`;
 const packs = q/pk; const whole = Math.abs(packs-Math.round(packs))<1e-9;
 return `= <b>${kg(q)} kg</b> · ${whole?`${Math.round(packs)} pack${Math.round(packs)===1?'':'s'}`:`${(Math.round(packs*100)/100)} packs`} of ${pk} kg`;
}
function valBox(v){
 let head;
 if(v.errs) head=`<div class="alert a-err val-head">${I('err')}<div class="grow"><b>${v.errs===1?'1 issue':v.errs+' issues'} to fix</b><div class="sub">${esc(v.items.find(i=>i.state==='error').text)}</div></div></div>`;
 else if(v.pend) head=`<div class="alert a-pend val-head">${I('clip')}<div class="grow"><b>Complete ${v.pend} required field${v.pend>1?'s':''}</b><div class="sub">${esc(v.items.find(i=>i.state==='pending').text)}</div></div></div>`;
 else if(v.warns) head=`<div class="alert a-warn val-head">${I('warn')}<div class="grow"><b>Validated with ${v.warns} warning${v.warns>1?'s':''}</b><div class="sub">Review before submitting.</div></div></div>`;
 else head=`<div class="alert a-ok val-head">${I('okc')}<div class="grow"><b>Batch validated successfully</b><div class="sub">Ready to submit.</div></div></div>`;
 const icon = {ok:'okc',warn:'warn',error:'err',pending:'dot'};
 const dupAck = v.dup ? `<div style="padding:0 20px 14px"><label class="check"><input type="checkbox" id="dupack" data-a="dupack" ${S.draft.dupAck?'checked':''}><span>I have checked. This is a separate transaction.</span></label></div>` : '';
 return `${head}<div class="val-list">${v.items.map(i=>`<div class="vi ${i.state}">${I(icon[i.state])}<span>${esc(i.text)}</span></div>`).join('')}</div>${dupAck}`;
}
function actionBar(){
 const v = validate(S.draft);
 const why = v.errs ? 'Fix the issues above to continue' : v.pend ? v.items.find(i=>i.state==='pending').text : '';
 return `<div class="actionbar"><div class="wrap">${why?`<div class="why" id="why">${esc(why)}</div>`:''}<button class="btn btn-primary btn-xl" data-a="review" ${v.ok?'':'disabled'}>${I('check')}Submit Transaction</button></div></div>`;
}
function refreshVerify(){

   ${SC.state==='reading'?`<div class="sc-msg"><div>${I('qr')}Reading label…</div></div>`:''}
  </div>
  ${SC.state==='found'?`<div class="sc-ok" role="status"><div>${I('okc')}Batch scanned successfully</div></div>`:''}</div>
  <div class="sc-bottom">
   ${SC.err?`<div class="sc-err" role="alert">${esc(SC.err)}</div>`:''}
   <div class="inst">Align the batch QR code or barcode within the frame</div>
   ${SC.state==='found'?'':`
   <button class="btn ${live?'btn-outline':'btn-primary'} btn-block" data-s="photo">${I('image')}Take Photo of Label</button>
   <div class="sc-samples" aria-label="Sample labels"><span class="lab">Sample labels:</span>${SAMPLES.map((s,i)=>`<button data-s="sample" data-i="${i}"><span>${s[0]}</span> · ${s[1]}</button>`).join('')}</div>
   <button class="link" data-s="manual" style="color:#fff;align-self:center">Label damaged? Select batch from list</button>`}
  </div>`;
}
function paintScanner(){ const el=document.getElementById('scanner'); const keep = SC.stream && document.getElementById('vid'); el.innerHTML = scannerHTML(); if(SC.stream){ const v=document.getElementById('vid'); if(v){ v.srcObject=SC.stream; v.play().catch(()=>{}) } } }
async function openScanner(){
 S.sheet=null; render();
 const el=document.getElementById('scanner'); el.hidden=false; document.body.style.overflow='hidden';
 SC.err=''; SC.torch=false; SC.state='starting'; paintScanner();
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no api');
  SC.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  SC.state='live'; paintScanner(); loopDecode();
 }catch(e){ SC.stream=null; SC.state='nocam'; paintScanner() }
}
function closeScanner(){
 cancelAnimationFrame(SC.raf); if(SC.stream){ SC.stream.getTracks().forEach(t=>t.stop()); SC.stream=null }
 SC.state='idle'; const el=document.getElementById('scanner'); el.hidden=true; el.innerHTML=''; document.body.style.overflow='';
}
let detector=null;
async function getDetector(){ if(detector!==null) return detector; detector=false;
 try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); detector=new BarcodeDetector({formats:f.filter(x=>['qr_code','code_128','code_39','ean_13','data_matrix'].includes(x))}) } }catch(e){ detector=false }
 return detector }
async function decodeSource(src, w, h){
 const det = await getDetector();
 if(det){ try{ const r=await det.detect(src); if(r && r[0]) return r[0].rawValue }catch(e){} }
 if(window.jsQR){ const c=document.createElement('canvas'); const sc=Math.min(1,1000/Math.max(w,h)); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(src,0,0,c.width,c.height); const img=x.getImageData(0,0,c.width,c.height);
  const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'}); if(r) return r.data }
 return null;
}
function loopDecode(){
 let last=0;
 const tick = async ts => {
  if(SC.state!=='live') return;
  const v=document.getElementById('vid');
  if(v && v.readyState>=2 && ts-last>280 && !SC.busy){ last=ts; SC.busy=true; const txt=await decodeSource(v,v.videoWidth,v.videoHeight); SC.busy=false; if(txt){ handleCode(txt,'qr'); return } }
  SC.raf=requestAnimationFrame(tick);
 };
 SC.raf=requestAnimationFrame(tick);
}
function parsePayload(text){
 const t=String(text).trim(); let o={};
 try{ const j=JSON.parse(t); if(j && typeof j==='object'){ o={batch:j.batch||j.batchNo||j.b, vendor:j.vendor, product:j.product, mfg:j.mfg, exp:j.exp, pack:j.pack} } }catch(e){}
 if(!o.batch){ t.split(/[;|\n]/).forEach(p=>{ const m=p.match(/^\s*([A-Za-z]+)\s*[=:]\s*(.+?)\s*$/); if(m) o[m[1].toLowerCase()]=m[2] }); }
 if(!o.batch){ const m=t.toUpperCase().match(/\b([A-Z]{2,4}\d{4,6})\b/); if(m) o.batch=m[1] }
 if(o.batch) o.batch=String(o.batch).toUpperCase().trim();
 return o;
}
function handleCode(text, source){
 const p = parsePayload(text);
 if(!p.batch){ SC.state = SC.stream?'live':'nocam'; SC.err='This code does not contain a premix batch number. Scan the batch label on the premix bag.'; paintScanner(); if(SC.stream) loopDecode(); return }
 SC.err=''; SC.state='found'; paintScanner(); try{ navigator.vibrate && navigator.vibrate(60) }catch(e){}
 setTimeout(()=>{ closeScanner(); S.draft=newDraft(p.batch, source, p); go('verify') }, 900);
}
async function toggleTorch(){
 const tr = SC.stream && SC.stream.getVideoTracks()[0];
 try{ const cap = tr && tr.getCapabilities ? tr.getCapabilities() : {}; if(!cap.torch) throw 0; SC.torch=!SC.torch; await tr.applyConstraints({advanced:[{torch:SC.torch}]}); paintScanner() }
 catch(e){ toast('Flashlight is not available on this device') }
}
document.getElementById('photo').addEventListener('change', async e=>{
 const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
 if(document.getElementById('scanner').hidden) openScanner();
 SC.state='reading'; SC.err=''; paintScanner();
 try{
  const bmp = await (window.createImageBitmap ? createImageBitmap(f) : new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(f) }));
  const txt = await decodeSource(bmp, bmp.width, bmp.height);
  if(txt) handleCode(txt,'photo'); else { SC.state=SC.stream?'live':'nocam'; SC.err='No QR code or barcode found. Retake the photo with the label filling the frame.'; paintScanner(); if(SC.stream) loopDecode() }
 }catch(err){ SC.state=SC.stream?'live':'nocam'; SC.err='Could not read that photo. Try again.'; paintScanner() }
});
document.getElementById('scanner').addEventListener('click', e=>{
 const b=e.target.closest('[data-s]'); if(!b) return; const s=b.dataset.s;
 if(s==='close') closeScanner();
 else if(s==='torch') toggleTorch();
 else if(s==='photo') document.getElementById('photo').click();
 else if(s==='manual'){ closeScanner(); S.sheet='manual'; render() }
 else if(s==='sample'){ cancelAnimationFrame(SC.raf); SC.state='reading'; SC.err=''; paintScanner(); const smp=SAMPLES[+b.dataset.i]; setTimeout(()=>handleCode(smp[2],'qr'),650) }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(!document.getElementById('scanner').hidden) closeScanner(); else if(S.sheet){ S.sheet=null; render() } } });

/* ---------- Submit & sync ---------- */
function submit(){
 const d=S.draft; const v=validate(d); if(!v.ok){ S.sheet=null; render(); return }
 const q=qtyKg(d); const on=online();
 const id='PMX-2026-'+String(D.seq++).padStart(6,'0');
 const t={id, ts:Date.now(), user:USER.name, mill:D.mill, batch:d.batch, type:d.type, qty:Math.round(q*1000)/1000,
  source: d.type==='receive' ? (d.f.vendor||'Vendor') : mill(D.mill).name,
  dest: d.type==='relocate'?d.dest : d.type==='receive'?D.mill:'',
  adjDir: d.type==='adjust'?d.adjDir:undefined,
  remarks: [d.type==='adjust'?d.adjReason:'', d.override?`Expired batch override: ${d.approver}, ${d.ovrReason}`:'', edits(d).length?`Edited fields: ${edits(d).join(', ')}`:'', d.source==='manual'?'Batch selected manually':''].filter(Boolean).join(' · '),
  gps:null, sync: on?'synced':'pending'};
 if(d.type==='receive') addStock(d.batch,D.mill,q);
 else if(d.type==='consume') addStock(d.batch,D.mill,-q);
 else if(d.type==='relocate'){ addStock(d.batch,D.mill,-q); addStock(d.batch,d.dest,q) }
 else addStock(d.batch,D.mill,d.adjDir==='increase'?q:-q);
 D.txns.unshift(t); save();
 S.lastTxn=t; S.draft=null; S.sheet=null; go('success');
}
function syncPending(){
 const n=pending().length; if(!n || !online() || S.syncing) return;
 S.syncing=true; render();
 setTimeout(()=>{ D.txns.forEach(t=>{ if(t.sync==='pending') t.sync='synced' }); save(); S.syncing=false; render(); toast('All transactions synced', true) }, 1400);
}
window.addEventListener('online', ()=>{ render(); syncPending() });
window.addEventListener('offline', ()=>render());

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
 const el=e.target.closest('[data-a]'); if(!el) return;
 const a=el.dataset.a; const d=S.draft;
 if(a==='scrim'){ if(e.target===el){ S.sheet=null; render() } return }
 if(['ovr','dupack','setmill'].includes(a)) return; // handled on change
 switch(a){
  case 'go': if(el.dataset.f) S.invFilter=el.dataset.f; go(el.dataset.v); break;
  case 'scan': openScanner(); break;
  case 'manual': S.sheet='manual'; render(); break;
  case 'pick': S.draft=newDraft(el.dataset.b,'manual',{}); S.sheet=null; go('verify'); break;
  case 'startbatch': if(el.dataset.m!==D.mill){ D.mill=el.dataset.m; save(); toast('Current mill set to '+mill(D.mill).short) } S.draft=newDraft(el.dataset.b,'manual',{}); go('verify'); break;
  case 'profile': S.sheet='profile'; render(); break;
  case 'close': S.sheet=null; render(); break;
  case 'cancel': S.draft=null; go('home'); break;
  case 'edit': d.editing=!d.editing; render(); break;
  case 'qq': d.unit='kg'; d.qty=el.dataset.q; const qi=document.getElementById('qty'); if(qi) qi.value=d.qty; const us=document.getElementById('unit'); if(us) us.value='kg'; refreshVerify(); break;
  case 'type': d.type=el.dataset.t; d.dupAck=false; render(); break;
  case 'adj': d.adjDir=el.dataset.d; render(); break;
  case 'review': if(validate(d).ok){ S.sheet='confirm'; render() } break;
  case 'submit': submit(); break;
  case 'tx': S.detail=el.dataset.id; S.sheet='tx'; render(); break;
  case 'invf': S.invFilter=el.dataset.f; render(); break;
  case 'scope': S.invScope=el.dataset.s; render(); break;
  case 'txf': S.txFilter=el.dataset.f; render(); break;
  case 'offline': D.simOffline=!D.simOffline; save(); render(); if(!D.simOffline) setTimeout(syncPending,300); break;
  case 'syncnow': S.sheet=null; syncPending(); break;
  case 'reset': D=seed(); save(); S.sheet=null; toast('Sample data reset', true); go('home'); break;
 }
});
document.addEventListener('input', e=>{
 const t=e.target;
 if(t.id==='qty' && S.draft){ const clean=t.value.replace(/[^\d.,]/g,''); if(clean!==t.value) t.value=clean; S.draft.qty=clean; S.draft.dupAck=false; refreshVerify() }
 else if(t.id==='invq'){ S.invQ=t.value; const pos=t.selectionStart; render(); const n=document.getElementById('invq'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){} } }
 else if(t.dataset.edit && S.draft){ const k=t.dataset.edit; S.draft.f[k]= k==='pack'?(Number(t.value)||''):t.value; refreshVerify() }
});
document.addEventListener('change', e=>{
 const t=e.target;
 if(t.dataset.set && S.draft){ S.draft[t.dataset.set]=t.value; if(t.dataset.set==='unit'){ refreshVerify() } else render() }
 else if(t.dataset.a==='ovr'){ S.draft.override=t.checked; if(!t.checked){ S.draft.approver=''; S.draft.ovrReason='' } render() }
 else if(t.dataset.a==='dupack'){ S.draft.dupAck=t.checked; refreshVerify() }
 else if(t.dataset.a==='setmill'){ D.mill=t.value; save(); render(); toast('Current mill: '+mill(D.mill).short) }
 else if(t.dataset.edit && S.draft) render();
});

render();
setTimeout(syncPending, 600);
})();
</script>

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
